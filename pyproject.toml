[project]
name = "vexledger"
version = "0.1.0"
description = "Lightweight workbench for the lifecycle of VEX statements, from CycloneDX SBOMs to OpenVEX."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vassel Goleyu" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx[http2]>=0.28.1",
    "jsonschema>=4.26.0",
    "packageurl-python>=0.17.6",
    "packaging>=26.0",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.49,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vexledger = "vexledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexledger"]

[dependency-groups]
dev = [
    "cyclonedx-bom>=8.0.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF059", "S105", "S101", "S106", "S608", "E501", "ASYNC240", "RUF007", "S311"]
"tools/**" = ["S101", "S105", "S603", "S607", "S104"]  # dev-only scripts: dummy password, fixed local commands
"src/vexledger/db/models.py" = ["E501"]
"alembic/versions/*" = ["E501", "S608", "RUF012"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: needs real Postgres and Redis (make dev-up)",
  "live_osv: hits the real api.osv.dev, run manually by the owner",
]
addopts = "-m 'not live_osv'"

[tool.coverage.run]
source = ["src"]
