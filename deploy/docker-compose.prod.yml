# Production stack: Caddy (TLS) -> web (static UI) and app (API); worker; Postgres; Redis.
# Only Caddy publishes ports. Run from this directory with deploy/.env in place (see docs/DEPLOY.md).
name: vexledger

x-backend: &backend
  build: { context: .., dockerfile: deploy/Dockerfile.backend }
  image: vexledger-backend:local
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &backend-env
    VEXLEDGER_ENV: prod
    VEXLEDGER_DATABASE_URL: postgresql+asyncpg://vexledger:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/vexledger
    VEXLEDGER_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    VEXLEDGER_VEX_BASE_URL: ${VEXLEDGER_VEX_BASE_URL:?set VEXLEDGER_VEX_BASE_URL}
    VEXLEDGER_EVIDENCE_DIR: /data/evidence
    VEXLEDGER_LOG_LEVEL: ${VEXLEDGER_LOG_LEVEL:-INFO}
    VEXLEDGER_MAX_UPLOAD_MB: ${VEXLEDGER_MAX_UPLOAD_MB:-25}
    VEXLEDGER_DEMO_OSV_FIXTURES: ${DEMO_OSV_FIXTURES:-0}
  volumes: ["evidence:/data/evidence"]

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vexledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vexledger
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexledger -d vexledger"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  app:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *backend
    command: ["python", "-m", "vexledger.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "vexledger.worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    image: vexledger-web:local
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
      web: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  evidence:
  caddy_data:
  caddy_config:
