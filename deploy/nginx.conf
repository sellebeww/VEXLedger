server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Client-side routes fall back to the SPA shell; the file list in /api is Caddy's business.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /200.html;
    }
}
